[project]
name = "shelf"
version = "1.0.4"
description = "A self-hosted music server and player for your own CD rips"
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.14"
dependencies = [
    # Mozilla's certificate authorities, besides the computer's own (see trust.py).
    "certifi>=2024.2.2",
    # Tempo, key and "sounds like" analysis. It has no Windows version; Shelf runs without it.
    "essentia>=2.1b6.dev1438; sys_platform != 'win32'",
    "fastapi>=0.162.1",
    "itsdangerous>=2.2.0",
    "mutagen>=1.48.1",
    "numpy>=2.0",
    "pillow>=13.0.0",
    "uvicorn[standard]>=0.54.0",
    "yt-dlp>=2026.10.26",
]

[project.scripts]
shelf = "shelf:main"

[build-system]
requires = ["uv_build>=0.11.9,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
]
