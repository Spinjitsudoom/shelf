# Builds every app and attaches them to a GitHub release.
#
# To release version 0.7.0: set it in pyproject.toml and src/shelf/__init__.py, then
#   git tag v0.7.0 && git push origin v0.7.0
# Running this workflow by hand (Actions tab) builds everything without making a release.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      code: ${{ steps.v.outputs.code }}
    steps:
      - uses: actions/checkout@v7
      - id: v
        name: Read the version (and check the tag matches it)
        run: |
          version=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' src/shelf/__init__.py)
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "::error::The tag is ${GITHUB_REF_NAME} but src/shelf/__init__.py says $version"; exit 1
          fi
          IFS=. read -r major minor patch <<< "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "code=$((major * 10000 + minor * 100 + patch))" >> "$GITHUB_OUTPUT"

  android:
    name: Android apps (Shelf and Shelf Lite)
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - name: Signing key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        # The same key as every earlier release, so the app updates in place. Without the secret
        # (e.g. in a fork) the build is signed with a throwaway debug key instead.
        run: if [ -n "$KEYSTORE" ]; then echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/shelf.keystore"; echo "SHELF_KEYSTORE=$RUNNER_TEMP/shelf.keystore" >> "$GITHUB_ENV"; fi
      - name: Build
        working-directory: android
        env:
          VERSION_NAME: ${{ needs.version.outputs.version }}
          VERSION_CODE: ${{ needs.version.outputs.code }}
        run: |
          ./gradlew --no-daemon testDebugUnitTest assembleRelease -PversionName="$VERSION_NAME" -PversionCode="$VERSION_CODE"
          mkdir -p ../out && cp app/build/outputs/apk/release/app-release.apk "../out/Shelf-${VERSION_NAME}.apk"
      # Shelf Lite: the lightweight app (the web app in a small shell), built without Gradle.
      # Its name sorts before Shelf's, because the WebView app's updater (0.6.0) takes the last APK.
      - name: Android SDK parts (Shelf Lite)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;34.0.0" "platforms;android-34" > /dev/null
      - name: Build Shelf Lite
        env:
          VERSION_NAME: ${{ needs.version.outputs.version }}
          VERSION_CODE: ${{ needs.version.outputs.code }}
        run: |
          mkdir -p "$RUNNER_TEMP/android"
          if [ -n "${SHELF_KEYSTORE:-}" ]; then cp "$SHELF_KEYSTORE" "$RUNNER_TEMP/android/debug.keystore"; fi
          ANDROID_BUILD="$RUNNER_TEMP/android" bash android-lite/build.sh
          cp android-lite/build/shelf.apk "out/Shelf-${VERSION_NAME}-Lite.apk"
      - uses: actions/upload-artifact@v7
        with:
          name: android
          path: out/*

  desktop-windows:
    name: Desktop player (Windows)
    needs: version
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci
      - run: npm version --no-git-tag-version --allow-same-version ${{ needs.version.outputs.version }}
      - run: npx electron-builder --win nsis --publish never
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-windows
          # latest.yml and the blockmap tell installed players about the update.
          path: |
            desktop/dist/*.exe
            desktop/dist/*.exe.blockmap
            desktop/dist/latest.yml

  desktop-linux:
    name: Desktop player (Linux .deb and Flatpak)
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Build the .deb and the app folder
        working-directory: desktop
        run: |
          npm ci
          npm version --no-git-tag-version --allow-same-version ${{ needs.version.outputs.version }}
          npx electron-builder --linux deb dir --publish never
      - name: Flatpak tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq flatpak flatpak-builder
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
      - name: Build the Flatpak
        run: |
          sed -i "s/<release version=\"[^\"]*\" date=\"[^\"]*\"/<release version=\"${{ needs.version.outputs.version }}\" date=\"$(date +%F)\"/" \
            packaging/flatpak/io.github.spinjitsudoom.Shelf.metainfo.xml
          flatpak-builder --user --install-deps-from=flathub --force-clean --repo=repo build-dir \
            packaging/flatpak/io.github.spinjitsudoom.Shelf.yml
          flatpak build-bundle repo "desktop/dist/Shelf-${{ needs.version.outputs.version }}.flatpak" io.github.spinjitsudoom.Shelf
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-linux
          path: |
            desktop/dist/*.deb
            desktop/dist/*.flatpak
            desktop/dist/latest-linux.yml

  server-windows:
    name: Server (Windows installer)
    needs: version
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v10.3.3
      - name: Python libraries (as locked) and the packaging tools
        run: |
          uv export --frozen --no-dev --no-hashes --no-emit-project -o "$env:RUNNER_TEMP\requirements.txt"
          python -m pip install -r "$env:RUNNER_TEMP\requirements.txt" pyinstaller pystray
          python -m pip install --no-deps .
      - name: Package with PyInstaller
        run: pyinstaller --noconfirm packaging/windows/shelf-server.spec
      - name: Add ffmpeg
        run: |
          python packaging/windows/fetch_ffmpeg.py "dist\Shelf Server\ffmpeg"
          "$PWD\dist\Shelf Server\ffmpeg" | Out-File -FilePath $env:GITHUB_PATH -Append
      - name: Check the tray program has everything
        run: |
          $p = Start-Process -FilePath "dist\Shelf Server\Shelf Server.exe" -ArgumentList "--self-test" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Shelf Server.exe --self-test failed ($($p.ExitCode))" }
      - name: Smoke test the packaged server
        run: python packaging/smoke_test.py "dist\Shelf Server\shelf-server.exe"
      - name: Make the installer
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) {
            $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
            if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
            "${env:ProgramFiles(x86)}\Inno Setup 6" | Out-File -FilePath $env:GITHUB_PATH -Append
            $env:PATH = "${env:ProgramFiles(x86)}\Inno Setup 6;$env:PATH"
          }
          iscc /Qp /DAppVersion=${{ needs.version.outputs.version }} packaging\windows\installer.iss
      - name: Install it and smoke test the installed copy
        run: |
          $setup = Get-ChildItem dist\Shelf-Server-Setup-*.exe | Select-Object -First 1
          # A silent install is how updates run, so it starts the server again in the background.
          # Wait for the installer alone (-Wait would also wait for that server), then stop the server.
          $p = Start-Process -FilePath $setup.FullName -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -PassThru
          if (-not $p.WaitForExit(600000)) { throw "The installer didn't finish in 10 minutes" }
          if ($p.ExitCode -ne 0) { throw "The installer failed ($($p.ExitCode))" }
          Start-Sleep -Seconds 5
          Get-Process -Name "Shelf Server", "shelf-server" -ErrorAction SilentlyContinue | Stop-Process -Force
          python packaging/smoke_test.py "$env:LOCALAPPDATA\Programs\Shelf Server\shelf-server.exe"
      - name: The installed copy measures songs (tempo, key, "sounds like") without Essentia
        run: |
          $exe = "$env:LOCALAPPDATA\Programs\Shelf Server\shelf-server.exe"
          # 40 seconds of clicks at 120 BPM.
          ffmpeg -v error -y -f lavfi -i "aevalsrc='if(lt(mod(t,0.5),0.03),sin(2*PI*1000*t)*exp(-100*mod(t,0.5)),0)+0.002*(random(0)-0.5)':s=44100:d=40" clicks.wav
          $a = (& $exe --module shelf.analysis clicks.wav | Select-Object -Last 1) | ConvertFrom-Json
          if (-not $a.bpm -or [math]::Abs($a.bpm - 120) -gt 3) { throw "Tempo not measured: $($a | ConvertTo-Json -Compress)" }
          if (-not $a.mix) { throw "Mix points not measured" }
          $v = (& $exe --module shelf.sound clicks.wav 40 | Select-Object -Last 1) | ConvertFrom-Json
          if ($v.Count -ne 52) { throw "Sound fingerprint not measured: $v" }
          "Measured: $($a.bpm) BPM, key $($a.key), fingerprint of $($v.Count) numbers"
      - uses: actions/upload-artifact@v7
        with:
          name: server-windows
          path: dist/Shelf-Server-Setup-*.exe

  release:
    name: Publish the release
    if: github.ref_type == 'tag'
    needs: [version, android, desktop-windows, desktop-linux, server-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: files
          merge-multiple: true
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp install.sh files/
          gh release create "$GITHUB_REF_NAME" files/* --title "Shelf ${{ needs.version.outputs.version }}" --generate-notes \
            --notes-file packaging/release-notes.md
