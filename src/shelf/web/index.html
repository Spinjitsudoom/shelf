    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  </svg>

  <div id="app" class="app" hidden>
    <header class="topbar">
      <div class="topbar-start">
        <a class="brand" href="#/" aria-label="Shelf home"><img src="icons/icon.svg" alt="" width="30" height="30"></a>
        <button class="icon-btn" id="nav-back" type="button" aria-label="Go back" title="Go back"><svg><use href="#i-back"/></svg></button>
        <button class="icon-btn" id="nav-fwd" type="button" aria-label="Go forward" title="Go forward"><svg><use href="#i-forward"/></svg></button>
      </div>
      <div class="topbar-center">
        <a class="home-btn" href="#/" data-nav="home" aria-label="Home" title="Home"><svg><use href="#i-home"/></svg></a>
        <div class="top-search">
          <svg aria-hidden="true"><use href="#i-search"/></svg>
          <input id="top-search" type="search" placeholder="Search songs, albums and artists" aria-label="Search your library" autocomplete="off" enterkeyhint="search">
          <span class="top-search-sep" aria-hidden="true"></span>
          <a class="top-browse" href="#/albums" data-nav="albums" aria-label="Browse all albums" title="Browse all albums"><svg><use href="#i-albums"/></svg></a>
        </div>
      </div>
      <div class="topbar-end">
        <a class="icon-btn" href="#/stats" data-nav="stats" aria-label="Your listening" title="Your listening"><svg><use href="#i-stats"/></svg></a>
        <a class="icon-btn" href="#/people" data-nav="people" aria-label="Friend activity" title="Friend activity"><svg><use href="#i-people"/></svg></a>
        <a class="icon-btn" href="#/admin" data-nav="admin" id="admin-link" aria-label="Admin" title="Admin" hidden><svg><use href="#i-admin"/></svg></a>
        <a class="icon-btn" href="#/settings" data-nav="settings" aria-label="Settings" title="Settings"><svg><use href="#i-settings"/></svg></a>
      </div>
    </header>

    <aside class="library" id="library" aria-label="Your library">
      <div class="lib-head">
        <button class="lib-title" id="lib-collapse" type="button" aria-label="Collapse your library" title="Collapse your library">
          <svg><use href="#i-library"/></svg><span>Your Library</span>
        </button>
        <span class="lib-head-end">
          <button class="icon-btn lib-new" id="lib-new" type="button" aria-label="Create playlist" title="Create playlist"><svg><use href="#i-plus"/></svg></button>
          <a class="icon-btn lib-expand" href="#/playlists" aria-label="Show all playlists" title="Show all playlists"><svg><use href="#i-expand"/></svg></a>
        </span>
      </div>
      <div class="lib-chips" id="lib-chips" role="group" aria-label="Show"></div>
      <div class="lib-tools">
        <div class="lib-search" id="lib-search-wrap">
          <button class="icon-btn" id="lib-search-btn" type="button" aria-label="Search in your library" title="Search in your library"><svg><use href="#i-search"/></svg></button>
          <input id="lib-search" type="search" placeholder="Search in Your Library" aria-label="Search in your library" autocomplete="off">
        </div>
        <button class="lib-sort" id="lib-sort" type="button" aria-label="Sort by"><span id="lib-sort-label">Recents</span><svg><use href="#i-sort"/></svg></button>
      </div>
      <div class="lib-list" id="lib-list" role="list"></div>
    </aside>

    <div class="resizer" id="resize-lib" role="separator" aria-orientation="vertical" aria-label="Resize Your Library" tabindex="0"></div>
    <main id="view" class="view" tabindex="-1"></main>
    <div class="resizer" id="resize-npv" role="separator" aria-orientation="vertical" aria-label="Resize the Now Playing panel" tabindex="0" hidden></div>

    <aside class="npv" id="npv" aria-label="Now playing" hidden>
      <div class="npv-head">
        <a class="npv-context" id="npv-context" href="#/"></a>
        <button class="icon-btn" id="npv-close" type="button" aria-label="Close" title="Close"><svg><use href="#i-close"/></svg></button>
      </div>
      <div class="video-host" id="npv-video" hidden></div>
      <div class="npv-body" id="npv-body"></div>
    </aside>

    <section class="player" id="player" aria-label="Player" data-empty="true">
      <div class="player-progress-mini" aria-hidden="true"><div class="fill" id="mini-fill"></div></div>
      <div class="player-left">
        <button class="player-now" id="open-now" type="button" aria-label="Open now playing">
          <span class="case case-sm" id="player-cover"></span>
          <span class="player-text">
            <span class="player-title" id="player-title">Nothing playing</span>
            <span class="player-artist" id="player-artist">Pick an album to start</span>
            <span class="player-device" id="player-device" hidden><svg aria-hidden="true"><use href="#i-devices"/></svg><span id="player-device-name"></span></span>
          </span>
        </button>
        <button class="like-btn player-like" id="player-like" type="button" aria-pressed="false" aria-label="Add to Favourites" hidden><svg><use href="#i-heart"/></svg></button>
      </div>
      <div class="player-center">
        <div class="player-controls">
          <button class="icon-btn hide-mobile" id="btn-shuffle" type="button" aria-label="Shuffle" title="Shuffle" aria-pressed="false"><svg><use href="#i-shuffle"/></svg></button>
          <button class="icon-btn hide-mobile" id="btn-prev" type="button" aria-label="Previous"><svg><use href="#i-prev"/></svg></button>
          <button class="icon-btn show-mobile devices-btn" id="btn-devices-mini" type="button" aria-label="Play on another device"><svg><use href="#i-devices"/></svg></button>
          <button class="icon-btn play-btn" id="btn-play" type="button" aria-label="Play"><svg><use href="#i-play"/></svg></button>
          <button class="icon-btn" id="btn-next" type="button" aria-label="Next"><svg><use href="#i-next"/></svg></button>
          <button class="icon-btn hide-mobile" id="btn-repeat" type="button" aria-label="Repeat: off" data-mode="off"><svg><use href="#i-repeat"/></svg></button>
        </div>
        <div class="player-seek hide-mobile">
          <span class="time" id="time-cur">0:00</span>
          <input type="range" class="seek" id="seek" min="0" max="1000" value="0" step="1" aria-label="Seek">
          <span class="time" id="time-dur">0:00</span>
        </div>
      </div>
      <div class="player-extra hide-mobile">
        <button class="icon-btn panel-btn" id="btn-npv" type="button" aria-label="Now playing view" title="Now playing view" aria-pressed="false"><svg><use href="#i-npv"/></svg></button>
        <a class="icon-btn route-toggle" href="#/lyrics" data-route="lyrics" aria-label="Lyrics" title="Lyrics"><svg><use href="#i-mic"/></svg></a>
        <button class="icon-btn panel-btn" id="btn-queue" type="button" aria-label="Queue" title="Queue" aria-pressed="false"><svg><use href="#i-queue"/></svg></button>
        <button class="dj-skip" type="button" data-dj="skip" title="Switch it up: the DJ moves on to something different">DJ</button>
        <button class="icon-btn dj-req" type="button" data-dj-request aria-label="Request something" title="Request something"><svg><use href="#i-mic"/></svg></button>
        <button class="icon-btn sleep-btn" type="button" aria-label="Sleep timer" title="Sleep timer"><svg><use href="#i-moon"/></svg><span class="sleep-left"></span></button>
        <button class="icon-btn devices-btn" id="btn-devices" type="button" aria-label="Play on another device" title="Play on another device"><svg><use href="#i-devices"/></svg></button>
        <a class="icon-btn route-toggle" href="#/mixer" data-route="mixer" aria-label="Mixer" title="Mixer"><svg><use href="#i-eq"/></svg></a>
        <button class="icon-btn vol-btn" id="btn-mute" type="button" aria-label="Mute" title="Mute"><svg><use href="#i-volume"/></svg></button>
        <input type="range" class="volume" id="volume" min="0" max="1" step="0.01" value="1" aria-label="Volume">
        <button class="icon-btn" id="btn-fullscreen" type="button" aria-label="Full screen" title="Full screen"><svg><use href="#i-fullscreen"/></svg></button>
      </div>
    </section>

    <nav class="tabbar" aria-label="Sections">
      <a href="#/" data-nav="home"><svg><use href="#i-home"/></svg><span>Home</span></a>
      <a href="#/albums" data-nav="albums"><svg><use href="#i-albums"/></svg><span>Albums</span></a>
      <a href="#/artists" data-nav="artists"><svg><use href="#i-artists"/></svg><span>Artists</span></a>
      <a href="#/search" data-nav="search"><svg><use href="#i-search"/></svg><span>Search</span></a>
      <a href="#/playlists" data-nav="playlists"><svg><use href="#i-playlist"/></svg><span>Playlists</span></a>
    </nav>
  </div>

  <!-- Full-screen now playing: the disc (or record) slides out of its case (or sleeve) while music plays. -->
  <div class="nowplaying" id="nowplaying" role="dialog" aria-modal="true" aria-label="Now playing" hidden>
    <div class="np-backdrop" id="np-backdrop" aria-hidden="true"></div>
    <canvas class="np-viz" id="np-viz-ring" aria-hidden="true"></canvas>
    <div class="np-inner">
      <header class="np-head">
        <button class="icon-btn" id="np-close" type="button" aria-label="Close now playing"><svg><use href="#i-down"/></svg></button>
        <a class="np-from" id="np-from" href="#/"></a>
        <span class="np-head-end">
          <button class="icon-btn" id="np-viz" type="button" aria-pressed="false" aria-label="Visualizer" title="Visualizer"><svg><use href="#i-stats"/></svg></button>
          <a class="icon-btn" href="#/mixer" aria-label="Mixer"><svg><use href="#i-eq"/></svg></a>
        </span>
      </header>
      <div class="np-stage">
        <div class="deck" id="np-deck" data-playing="false">
          <span class="disc" aria-hidden="true">
            <span class="disc-face" id="np-disc-face"></span>
            <span class="disc-sheen"></span>
            <span class="tonearm"><span class="tonearm-base"></span><span class="tonearm-arm"><span class="tonearm-head"></span></span></span>
          </span>
          <span class="case case-lg" id="np-cover"></span>
        </div>
        <div class="video-host" id="np-video" hidden></div>
        <div class="np-lyrics" id="np-lyrics" hidden><div class="np-lyrics-inner" id="np-lyrics-inner"></div></div>
      </div>
      <div class="np-meta">
        <div class="np-names">
          <h2 class="np-title" id="np-title"></h2>
          <span class="np-artist" id="np-artist"></span>
        </div>
        <button class="like-btn np-like" id="np-like" type="button" aria-pressed="false" aria-label="Add to Favourites"><svg><use href="#i-heart"/></svg></button>
      </div>
      <div class="np-seek">
        <input type="range" class="seek" id="np-seek" min="0" max="1000" value="0" step="1" aria-label="Seek">
        <div class="np-times"><span id="np-cur">0:00</span><span id="np-quality" class="badge"></span><span id="np-dur">0:00</span></div>
      </div>
      <div class="np-controls">
        <button class="icon-btn" id="np-shuffle" type="button" aria-label="Shuffle" aria-pressed="false"><svg><use href="#i-shuffle"/></svg></button>
        <button class="icon-btn big" id="np-prev" type="button" aria-label="Previous"><svg><use href="#i-prev"/></svg></button>
        <button class="icon-btn play-btn huge" id="np-play" type="button" aria-label="Play"><svg><use href="#i-play"/></svg></button>
        <button class="icon-btn big" id="np-next" type="button" aria-label="Next"><svg><use href="#i-next"/></svg></button>
        <button class="icon-btn" id="np-repeat" type="button" aria-label="Repeat: off" data-mode="off"><svg><use href="#i-repeat"/></svg></button>
      </div>
      <p class="np-upnext" id="np-upnext"></p>
      <div class="np-foot">
        <button class="np-device devices-btn" id="np-devices" type="button" aria-label="Play on another device">
          <svg aria-hidden="true"><use href="#i-devices"/></svg><span id="np-device-name"></span>
        </button>
        <span class="np-foot-end">
          <button class="icon-btn" id="np-video-btn" type="button" aria-label="Switch to video" aria-pressed="false" hidden><svg><use href="#i-video"/></svg></button>
          <button class="dj-skip" type="button" data-dj="skip" aria-label="Switch it up: the DJ moves on to something different">DJ</button>
          <button class="icon-btn dj-req" type="button" data-dj-request aria-label="Request something"><svg><use href="#i-mic"/></svg></button>
          <button class="icon-btn sleep-btn" type="button" aria-label="Sleep timer"><svg><use href="#i-moon"/></svg><span class="sleep-left"></span></button>
          <button class="icon-btn" id="np-lyrics-btn" type="button" aria-label="Lyrics" aria-pressed="false"><svg><use href="#i-mic"/></svg></button>
          <a class="icon-btn" href="#/queue" id="np-queue" aria-label="Queue"><svg><use href="#i-queue"/></svg></a>
        </span>
      </div>
    </div>
  </div>

  <div class="offline-bar" role="status"><svg aria-hidden="true"><use href="#i-offline"/></svg>You’re offline. Your downloads still play. <a href="#/downloads">Downloads</a></div>

  <div class="login" id="login" hidden>
    <form class="login-card" id="login-form" novalidate>
      <img src="icons/icon.svg" alt="" width="56" height="56">
      <h1 id="login-title">Shelf</h1>
      <p class="login-lead" id="login-lead" hidden></p>
      <div class="server-box" id="server-box">
        <svg aria-hidden="true"><use href="#i-server"/></svg>
        <span class="server-text"><span class="server-label">Server</span><span class="server-url" id="server-url"></span></span>
        <button class="btn btn-small" type="button" id="server-change">Change</button>
      </div>
      <div class="server-edit" id="server-edit" hidden>
        <label for="login-server">Server address</label>
        <div class="server-row">
          <input id="login-server" type="url" inputmode="url" autocomplete="url" autocapitalize="off" spellcheck="false" placeholder="192.168.1.20:4533">
          <button class="btn" type="button" id="server-go">Connect</button>
        </div>
        <p class="server-hint">The address you open Shelf at in a browser, like <b>192.168.1.20:4533</b>.</p>
      </div>
      <div class="login-fields" id="login-fields">
        <label for="login-username">Username</label>
        <input id="login-username" type="text" autocomplete="username" autocapitalize="off" spellcheck="false" maxlength="32" required>
        <label for="login-password">Password</label>
        <input id="login-password" type="password" autocomplete="current-password" required>
        <label for="login-confirm" class="setup-only" hidden>Type the password again</label>
        <input id="login-confirm" class="setup-only" type="password" autocomplete="new-password" hidden>
      </div>
      <p class="login-error" id="login-error" role="alert"></p>
      <button class="btn btn-primary" type="submit" id="login-submit">Sign in</button>
    </form>
  </div>

  <div class="dj-caption" id="dj-caption" role="status" aria-live="polite" hidden>
    <span class="dj-caption-badge" aria-hidden="true"><i></i><i></i><i></i></span>
    <span class="dj-caption-text"></span>
    <span class="dj-caption-rate">
      <button class="icon-btn" type="button" data-dj-rate="up" aria-pressed="false" aria-label="I liked that" title="I liked that"><svg><use href="#i-thumb-up"/></svg></button>
      <button class="icon-btn" type="button" data-dj-rate="down" aria-pressed="false" aria-label="Not for me" title="Not for me"><svg><use href="#i-thumb-down"/></svg></button>
    </span>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <div class="menu-layer" id="menu-layer" hidden></div>
  <!-- Two players take turns so the next track is already loaded when this one ends (gapless). -->
  <audio id="audio-a" preload="auto"></audio>
  <audio id="audio-b" preload="auto"></audio>

  <script type="module" src="js/main.js"></script>
</body>
</html>
