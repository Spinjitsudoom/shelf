<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <title>Shared music</title>
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/fonts/fonts.css">
  <style>
    :root {
      --tray: #e9ebee; --sleeve: #f7f8fa; --ink: #1c2029; --ink-2: #5a6271; --rule: #d3d7de;
      --cobalt: #2c4fd0; --cobalt-ink: #fff; --hover: rgba(28, 32, 41, .06);
      --shadow: 0 1px 1px rgba(20, 24, 33, .12), 0 10px 24px -8px rgba(20, 24, 33, .4);
      --font: "Archivo", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      color-scheme: light;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --tray: #1a1d24; --sleeve: #232731; --ink: #e6e9ef; --ink-2: #99a1b0; --rule: #323745;
        --cobalt: #8199ff; --cobalt-ink: #0f1424; --hover: rgba(230, 233, 239, .07);
        --shadow: 0 1px 1px rgba(0, 0, 0, .4), 0 10px 24px -8px rgba(0, 0, 0, .75);
        color-scheme: dark;
      }
    }
    :root[data-theme="dark"] {
      --tray: #1a1d24; --sleeve: #232731; --ink: #e6e9ef; --ink-2: #99a1b0; --rule: #323745;
      --cobalt: #8199ff; --cobalt-ink: #0f1424; --hover: rgba(230, 233, 239, .07); color-scheme: dark;
    }
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; }
    body { background: var(--tray); color: var(--ink); font: 15px/1.45 var(--font); min-height: 100vh; padding-bottom: 96px; }
    main { max-width: 720px; margin: 0 auto; padding: 40px 16px 24px; }
    .head { display: grid; grid-template-columns: 220px 1fr; gap: 28px; align-items: end; }
    .cover { width: 220px; aspect-ratio: 1; border-radius: 4px; background: var(--sleeve) center/cover no-repeat;
      box-shadow: var(--shadow); position: relative; overflow: hidden; }
    .cover::after { content: ""; position: absolute; inset: 0; border-radius: 4px;
      background: linear-gradient(115deg, rgba(255, 255, 255, .22), transparent 38%); pointer-events: none; }
    .cover.empty { display: grid; place-items: center; color: var(--ink-2); }
    .kind { margin: 0 0 4px; color: var(--ink-2); font-size: 13px; }
    h1 { margin: 0; font-size: clamp(26px, 5vw, 40px); line-height: 1.1; letter-spacing: -.01em; overflow-wrap: anywhere; }
    .by { margin: 6px 0 0; font-weight: 600; }
    .meta { margin: 8px 0 0; color: var(--ink-2); font-size: 13px; }
    .play-all { margin-top: 18px; display: inline-flex; align-items: center; gap: 8px; border: 0; border-radius: 999px;
      background: var(--cobalt); color: var(--cobalt-ink); font: 600 15px var(--font); padding: 11px 22px 11px 18px; cursor: pointer; }
    .play-all svg { width: 18px; height: 18px; }
    button:focus-visible, li:focus-visible { outline: 2px solid var(--cobalt); outline-offset: 2px; }
    ol { list-style: none; margin: 32px 0 0; padding: 0; }
    li { display: grid; grid-template-columns: 32px 1fr auto; gap: 12px; align-items: center; padding: 9px 10px;
      border-radius: 6px; cursor: pointer; }
    li:hover { background: var(--hover); }
    li .n { color: var(--ink-2); text-align: right; font-variant-numeric: tabular-nums; }
    li .t { min-width: 0; }
    li .t b, li .t span { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    li .t b { font-weight: 600; }
    li .t span, li .d { color: var(--ink-2); font-size: 13px; }
    li .d { font-variant-numeric: tabular-nums; }
    li.on b, li.on .n { color: var(--cobalt); }
    .note { text-align: center; color: var(--ink-2); margin-top: 18vh; }
    .note h1 { font-size: 24px; color: var(--ink); margin-bottom: 8px; }
    footer { margin: 36px 0 0; color: var(--ink-2); font-size: 12px; text-align: center; }
    .bar { position: fixed; left: 0; right: 0; bottom: 0; background: var(--sleeve); border-top: 1px solid var(--rule);
      padding: 10px 16px calc(10px + env(safe-area-inset-bottom)); display: grid; grid-template-columns: 44px 1fr; gap: 14px; align-items: center; }
    .bar[hidden] { display: none; }
    .bar .toggle { width: 44px; height: 44px; border-radius: 50%; border: 0; background: var(--cobalt); color: var(--cobalt-ink);
      display: grid; place-items: center; cursor: pointer; }
    .bar .toggle svg { width: 20px; height: 20px; }
    .bar .now { min-width: 0; }
    .bar .now b { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 600; }
    .bar .line { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; font-size: 12px; color: var(--ink-2);
      font-variant-numeric: tabular-nums; }
    .bar input[type=range] { width: 100%; accent-color: var(--cobalt); }
    @media (max-width: 560px) {
      main { padding-top: 24px; }
      .head { grid-template-columns: 1fr; gap: 18px; }
      .cover { width: min(260px, 72vw); }
    }
  </style>
</head>
<body>
  <main id="main"><p class="note">Loading…</p></main>
  <div class="bar" id="bar" hidden>
    <button class="toggle" id="toggle" type="button" aria-label="Pause"></button>
    <div class="now">
      <b id="now-title"></b>
      <div class="line"><span id="pos">0:00</span><input id="seek" type="range" min="0" max="1" step="any" value="0" aria-label="Position"><span id="len">0:00</span></div>
    </div>
  </div>
  <audio id="audio" preload="none"></audio>
  <script>
    const token = location.pathname.split("/").filter(Boolean)[1] || "";
    const base = `/s/${encodeURIComponent(token)}`;
    const $ = (id) => document.getElementById(id);
    const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
    const clock = (s) => { s = Math.max(0, Math.floor(s || 0)); const h = Math.floor(s / 3600), m = Math.floor(s / 60) % 60, x = String(s % 60).padStart(2, "0");
      return h ? `${h}:${String(m).padStart(2, "0")}:${x}` : `${m}:${x}`; };
    const PLAY = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4.5v15l13-7.5z"/></svg>';
    const PAUSE = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>';
    const audio = $("audio");
    let info = null, index = -1;

    function render() {
      const kinds = { track: "Song", album: "Album", playlist: "Playlist" };
      const total = info.tracks.reduce((a, t) => a + t.duration, 0);
      const runsOut = info.expiresAt ? `This link works until ${new Date(info.expiresAt * 1000).toLocaleDateString(undefined, { day: "numeric", month: "long" })}.` : "";
      document.title = `${info.title}${info.by && info.kind !== "playlist" ? ` by ${info.by}` : ""}`;
      $("main").innerHTML = `
        <section class="head">
          <div class="cover${info.cover ? "" : " empty"}" ${info.cover ? `style="background-image:url('${esc(info.cover)}&size=640')"` : ""} role="img" aria-label="Cover"></div>
          <div>
            <p class="kind">${kinds[info.kind]} shared by ${esc(info.sharedBy)}</p>
            <h1>${esc(info.title)}</h1>
            ${info.by ? `<p class="by">${esc(info.by)}</p>` : ""}
            <p class="meta">${info.tracks.length === 1 ? "1 song" : `${info.tracks.length} songs`}, ${clock(total)}. ${esc(runsOut)}</p>
            ${info.tracks.length ? `<button class="play-all" type="button" id="play-all">${PLAY}Play</button>` : ""}
          </div>
        </section>
        ${info.tracks.length > 1 ? `<ol>${info.tracks.map((t, i) => `
          <li tabindex="0" data-i="${i}"><span class="n">${i + 1}</span>
            <span class="t"><b>${esc(t.title)}</b>${t.artist !== info.by ? `<span>${esc(t.artist)}</span>` : ""}</span>
            <span class="d">${clock(t.duration)}</span></li>`).join("")}</ol>` : ""}
        <footer>Shared from a Shelf music server. Listening here doesn’t need an account.</footer>`;
      $("play-all")?.addEventListener("click", () => (index >= 0 ? toggle() : play(0)));
      document.querySelectorAll("li[data-i]").forEach((li) => {
        li.addEventListener("click", () => play(Number(li.dataset.i)));
        li.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); play(Number(li.dataset.i)); } });
      });
    }

    function play(i) {
      const t = info.tracks[i];
      if (!t) return;
      index = i;
      audio.src = `${base}/tracks/${t.id}/stream`;
      audio.play().catch(() => {});
      $("bar").hidden = false;
      $("now-title").textContent = `${t.title} · ${t.artist}`;
      document.querySelectorAll("li[data-i]").forEach((li) => li.classList.toggle("on", Number(li.dataset.i) === i));
      if ("mediaSession" in navigator) {
        navigator.mediaSession.metadata = new MediaMetadata({ title: t.title, artist: t.artist, album: t.album,
          artwork: t.cover ? [{ src: `${base}/albums/${t.albumId}/cover?v=${t.cover}&size=512`, sizes: "512x512" }] : [] });
      }
    }
    function toggle() { if (audio.paused) audio.play().catch(() => {}); else audio.pause(); }
    function paint() {
      const playing = !audio.paused;
      $("toggle").innerHTML = playing ? PAUSE : PLAY;
      $("toggle").setAttribute("aria-label", playing ? "Pause" : "Play");
      const all = $("play-all");
      if (all) all.innerHTML = `${playing ? PAUSE : PLAY}${playing ? "Pause" : index >= 0 ? "Resume" : "Play"}`;
    }

    $("toggle").addEventListener("click", toggle);
    audio.addEventListener("play", paint);
    audio.addEventListener("pause", paint);
    audio.addEventListener("ended", () => (index < info.tracks.length - 1 ? play(index + 1) : paint()));
    audio.addEventListener("error", () => { if (index >= 0) $("now-title").textContent = "This song couldn’t be played."; });
    audio.addEventListener("timeupdate", () => {
      const d = audio.duration || info.tracks[index]?.duration || 0;
      $("pos").textContent = clock(audio.currentTime);
      $("len").textContent = clock(d);
      $("seek").max = d || 1;
      $("seek").value = audio.currentTime;
    });
    $("seek").addEventListener("input", (e) => { audio.currentTime = Number(e.target.value); });
    if ("mediaSession" in navigator) {
      navigator.mediaSession.setActionHandler("previoustrack", () => play(Math.max(0, index - 1)));
      navigator.mediaSession.setActionHandler("nexttrack", () => play(index + 1));
    }

    fetch(`${base}/info`).then(async (r) => {
      if (!r.ok) {
        const why = r.status === 410 ? "This link has expired." : "This link doesn’t work. It may have been stopped.";
        $("main").innerHTML = `<div class="note"><h1>Nothing to play</h1><p>${why} Ask whoever sent it for a new one.</p></div>`;
        document.title = "Nothing to play";
        return;
      }
      info = await r.json();
      render();
    }).catch(() => { $("main").innerHTML = `<div class="note"><h1>Couldn’t reach the server</h1><p>Check your connection and reload.</p></div>`; });
  </script>
</body>
</html>
